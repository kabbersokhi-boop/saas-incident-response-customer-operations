name: Public deterministic checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check-public --history
      - run: node --test n8n/evaluation/test_eval.mjs tests/workflow-safety.test.mjs
      - run: node n8n/evaluation/run_eval.mjs --dry-run
