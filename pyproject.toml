[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relaycart-incident-demo"
version = "0.1.0"
description = "Synthetic local demo for SaaS incident response and customer operations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
